# A push here publishes the documentation. This is the part that makes that true.
#
# The docs are built and deployed by mirasvit/mipler-site, not by this repository, and the reason is
# credentials: that build needs the GitLab registry token and the site-deploy App key, which are org
# secrets granted to the four SITE repositories. Copying them into four documentation repositories
# to save one API call would widen registry write and site-deploy write to four more places.
#
# So the credentials stay there and the trigger comes from here.
#
# WHAT IT USES: mirasvit-site-docs-ci, an App that exists for this and nothing else. It is installed
# on mirasvit/mipler-site and mirasvit/mulwi-site ONLY, carries contents:write and metadata:read
# ONLY, and its key is readable by the three documentation repositories that send these dispatches.
#
# WHY NOT mirasvit-ci-app, which was the first attempt. That App would have worked -- it already has
# contents:write -- but it also carries administration:write and pull_requests:write, and its key is
# readable by 186 repositories. Installing it on the site repos would have meant any of those 186
# could mint a token that writes to mipler-site and mulwi-site. The fleet registry already warns
# that it "must never gain a permission that would let a module workflow escalate"; widening its
# reach instead is the same mistake wearing a different hat.
#
# contents:write, NOT actions:write, is what a repository_dispatch needs -- the registry notes that
# wsctl's contents:write "exists only because repository_dispatch counts as one".
#
# A MISSED DISPATCH IS NOT A LOST DEPLOY. mipler-site's docs workflow also runs on a schedule and skips when
# nothing changed, so this makes propagation immediate rather than making it possible.
name: notify-site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SITE_DOCS_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITE_DOCS_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scoped to the one repository this job talks to.
          repositories: mipler-site

      - name: Ask mipler-site to rebuild and deploy these docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/mirasvit/mipler-site/dispatches \
            -f event_type=docs-updated \
            -f 'client_payload[tree]=mipler' \
            -f "client_payload[sha]=${GITHUB_SHA}"
          echo "asked mirasvit/mipler-site to deploy the 'mipler' docs for ${GITHUB_SHA}"
