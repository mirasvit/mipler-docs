# A push here publishes the documentation. This is the part that makes that true.
#
# The docs are built and deployed by mirasvit/mipler-site, not by this repository, and the reason is
# credentials: that build needs the GitLab registry token and the site-deploy App key, which are org
# secrets granted to the four SITE repositories. Copying them into four documentation repositories
# to save one API call would widen registry write and site-deploy write to four more places.
#
# So the credentials stay there and the trigger comes from here.
#
# WHAT IT USES: mirasvit-ci-app, the organisation's CI App, minted with `repositories:` so the token
# it hands this job reaches ONLY mirasvit/mipler-site -- not this repository, and not the other 180-odd the
# App is installed on. That scoping is the whole reason the fleet uses one App rather than a token
# per lane.
#
# contents:write, NOT actions:write, is what a repository_dispatch needs. The App already has it;
# the registry in mirasvit-server/fleet-inventory notes that wsctl's contents:write "exists only
# because repository_dispatch counts as one". No new credential, no personal access token.
#
# A MISSED DISPATCH IS NOT A LOST DEPLOY. mipler-site's docs workflow also runs on a schedule and skips when
# nothing changed, so this makes propagation immediate rather than making it possible.
name: notify-site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scoped to the one repository this job talks to.
          repositories: mipler-site

      - name: Ask mipler-site to rebuild and deploy these docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/mirasvit/mipler-site/dispatches \
            -f event_type=docs-updated \
            -f 'client_payload[tree]=mipler' \
            -f "client_payload[sha]=${GITHUB_SHA}"
          echo "asked mirasvit/mipler-site to deploy the 'mipler' docs for ${GITHUB_SHA}"
